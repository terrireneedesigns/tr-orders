<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TR Orders Rules Tests</title>
<style>
  body { margin: 0; padding: 16px; background: #F9F6F0; color: #201C19; font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  #summary { font-weight: 700; margin: 8px 0 16px; }
  .pass { color: #2F6B3A; } .fail { color: #6E1A1E; }
  li { margin: 2px 0; font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
</style>
</head>
<body>
<h1>TR Orders: money and rules tests</h1>
<p>Runs in the browser. Open it from the dev server (<code>/tr-orders/tests/rules.test.html</code>) or from GitHub Pages.</p>
<div id="summary">Running…</div>
<ul id="results"></ul>
<script type="module">
  import { formatCents, centsToInput, parseMoney, sumCents } from '../js/money.js';
  import {
    itemUnitCents, itemTotalCents, computeTotals, upfrontCents, amountDueNow, paymentStatus,
    effectiveStatus, docFlags, statusInfo, applyLeftSleeve, tierWarnings, needsCustomQuoteWarning,
    newJacketDetails, extraLabel, DAY_MS
  } from '../js/rules.js';
  import { messageFor, customerLink } from '../js/share.js';

  const results = [];
  const eq = (name, got, want) => results.push({ name, ok: Object.is(got, want) || JSON.stringify(got) === JSON.stringify(want), got, want });

  // formatCents
  eq('formatCents 27500', formatCents(27500), '$275.00');
  eq('formatCents -300', formatCents(-300), '-$3.00');
  eq('formatCents 0', formatCents(0), '$0.00');
  eq('formatCents 123456789', formatCents(123456789), '$1,234,567.89');
  eq('formatCents 17051', formatCents(17051), '$170.51');

  // centsToInput
  eq('centsToInput 27500', centsToInput(27500), '275.00');
  eq('centsToInput -300', centsToInput(-300), '-3.00');
  eq('centsToInput 5', centsToInput(5), '0.05');

  // parseMoney
  eq('parseMoney "275"', parseMoney('275'), 27500);
  eq('parseMoney "275.5"', parseMoney('275.5'), 27550);
  eq('parseMoney "$1,234.56"', parseMoney('$1,234.56'), 123456);
  eq('parseMoney "-3"', parseMoney('-3'), -300);
  eq('parseMoney "-$3.00"', parseMoney('-$3.00'), -300);
  eq('parseMoney "(3.00)"', parseMoney('(3.00)'), -300);
  eq('parseMoney ".29" (no float error)', parseMoney('.29'), 29);
  eq('parseMoney "0.29"', parseMoney('0.29'), 29);
  eq('parseMoney "  45 "', parseMoney('  45 '), 4500);
  eq('parseMoney "" is invalid', parseMoney(''), null);
  eq('parseMoney "abc" is invalid', parseMoney('abc'), null);
  eq('parseMoney "1.234" is invalid', parseMoney('1.234'), null);
  eq('parseMoney "." is invalid', parseMoney('.'), null);
  eq('parseMoney "--3" is invalid', parseMoney('--3'), null);

  // Acceptance 1-3: package totals from the seeded lines (SPEC 14.1)
  const standard = [8500, 1800, 3000, 4000, 4500, 6000, -300].map((amount_cents) => ({ amount_cents }));
  eq('Standard lines before savings = $278.00', sumCents(standard.slice(0, 6)), 27800);
  eq('Standard package = $275.00', sumCents(standard), 27500);
  eq('Premium package = $335.00', sumCents(standard.concat([{ amount_cents: 6000 }])), 33500);
  eq('Collector\'s package = $405.00', sumCents(standard.concat([{ amount_cents: 6000 }, { amount_cents: 7000 }])), 40500);


  // ---------- rules.js ----------
  const L = (amount_cents, kind = 'base', addon_id = '') => ({ amount_cents, kind, addon_id, label: 'x' });
  const standardLines = [L(8500), L(1800), L(3000), L(4000), L(4500), L(6000), L(-300, 'savings')];
  const premiumLines = standardLines.concat([L(6000, 'upgrade')]);
  const collectorLines = premiumLines.concat([L(7000, 'upgrade')]);
  eq('1: Standard item total $275.00', itemTotalCents({ qty: 1, lines: standardLines }), 27500);
  eq('2: Premium $335.00', itemUnitCents(premiumLines), 33500);
  eq('3: Collector\'s $405.00', itemUnitCents(collectorLines), 40500);
  const sleeve = { addon_id: 'A_LS', label: 'Left sleeve surcharge', amount_cents: 1000 };
  const lookbook = applyLeftSleeve(standardLines.concat([L(2800, 'addon', 'A_XS'), L(2800, 'addon', 'A_XS')]), 'left', sleeve);
  eq('4: Standard + 2 extra small + left sleeve = $341.00', itemUnitCents(lookbook), 34100);
  const once = applyLeftSleeve(applyLeftSleeve(standardLines, 'left', sleeve), 'left', sleeve);
  eq('5: left sleeve added once', once.filter((l) => l.addon_id === 'A_LS').length, 1);
  eq('5: switching to right removes it', applyLeftSleeve(once, 'right', sleeve).some((l) => l.addon_id === 'A_LS'), false);
  eq('5: no left-sleeve add-on configured: unchanged', applyLeftSleeve(standardLines, 'left', null), standardLines);
  const d = newJacketDetails();
  eq('jacket has 4 included spots', d.spots.map((s) => s.key), ['back', 'left_chest', 'right_chest', 'sleeve']);
  d.spots.push({ key: 'extra_a' }, { key: 'extra_b' });
  eq('6: 2 extras: no warning yet', needsCustomQuoteWarning(d), false);
  d.spots.push({ key: 'extra_c' });
  eq('6: adding a 4th extra warns', needsCustomQuoteWarning(d), true);
  eq('extra labels', [0, 1, 2, 3].map(extraLabel), ['Extra A', 'Extra B', 'Extra C', 'Extra D']);
  const patches = [{ patch_no: '30', tier: 'premium' }, { patch_no: '01', tier: 'standard' }];
  const d7 = newJacketDetails(); d7.spots[0].patch_no = '30';
  const w = tierWarnings(d7, standardLines, patches);
  eq('7: Premium No. 30 on Standard back spot warns', w.map((x) => x.message), ['No. 30 is a Premium patch. Change to Premium package or add an upgrade?']);
  eq('7: no warning on Premium package', tierWarnings(d7, premiumLines, patches).length, 0);
  d7.spots[0].own_patch = true;
  eq('7: no warning for own patch', tierWarnings(d7, standardLines, patches).length, 0);
  eq('8: qty 2 Standard = $550.00', itemTotalCents({ qty: 2, lines: standardLines }), 55000);
  eq('totals with discount', computeTotals([{ qty: 1, lines: standardLines }], 2500), { subtotal_cents: 27500, total_cents: 25000 });
  eq('total never below 0', computeTotals([{ qty: 1, lines: standardLines }], 99999).total_cents, 0);
  eq('9: upfront 100% of $341 = $341.00', amountDueNow({ total_cents: 34100, upfront_percent: 100, paid_cents: 0 }), 34100);
  eq('10: upfront 50% of $341.01 = $170.51', upfrontCents(34101, 50), 17051);
  eq('10: balance not due until ready', amountDueNow({ total_cents: 34101, upfront_percent: 50, paid_cents: 17051, stage: 'in_progress' }), 0);
  eq('10: balance due when ready', amountDueNow({ total_cents: 34101, upfront_percent: 50, paid_cents: 17051, stage: 'ready' }), 17050);
  eq('payment status', [paymentStatus(0, 100), paymentStatus(50, 100), paymentStatus(100, 100), paymentStatus(150, 100)], ['unpaid', 'partial', 'paid', 'paid']);
  const now = Date.parse('2026-11-22T12:00:00-07:00');
  const iso = (t) => new Date(t).toISOString();
  const inv = { type: 'invoice', status: 'issued', stage: 'awaiting_payment', total_cents: 34100, paid_cents: 0, upfront_percent: 100 };
  const S = { unpaid_flag_days: 7, ready_flag_days: 3 };
  eq('12: sent 8 days ago, unpaid: overdue', docFlags({ ...inv, sent_at: iso(now - 8 * DAY_MS) }, 1, S, now).overdue, true);
  eq('12: sent 6 days ago: not yet', docFlags({ ...inv, sent_at: iso(now - 6 * DAY_MS) }, 1, S, now).overdue, false);
  eq('13: ready 4 days ago: Ready 3+ days', docFlags({ ...inv, stage: 'ready', paid_cents: 34100, ready_at: iso(now - 4 * DAY_MS) }, 1, S, now).ready_late, true);
  eq('13: balance overdue when unpaid', docFlags({ ...inv, stage: 'ready', ready_at: iso(now - 4 * DAY_MS) }, 1, S, now).balance_overdue, true);
  eq('14: not sent until sent_at is set', docFlags({ ...inv, status: 'draft' }, 1, S, now).not_sent, true);
  eq('14: empty draft is not "not sent"', docFlags({ ...inv, status: 'draft' }, 0, S, now).not_sent, false);
  eq('15: viewed', docFlags({ ...inv, first_viewed_at: iso(now) }, 1, S, now).viewed, true);
  const q = { type: 'quote', status: 'sent', sent_at: iso(now - 31 * DAY_MS), expires_at: iso(now - DAY_MS) };
  eq('17: quote past expiry is expired', effectiveStatus(q, now), 'expired');
  eq('quote expiring within 5 days', docFlags({ ...q, expires_at: iso(now + 2 * DAY_MS) }, 1, S, now).quote_expiring, true);
  eq('status labels', [statusInfo({ type: 'quote', status: 'draft' }).label, statusInfo({ type: 'invoice', status: 'issued', stage: 'ready' }).label,
    statusInfo({ type: 'invoice', status: 'void', stage: 'awaiting_payment' }).label], ['Draft', 'Ready', 'Void']);


  // ---------- share.js message templates (SPEC 7, 14.5) ----------
  const mdoc = { number: 'TR-1012', total_cents: 34100, amount_due_cents: 34100, public_id: 'abc', fulfillment: 'pickup' };
  const cust = { name: 'Denise Carter', phone: '480-555-0199' };
  const link = customerLink(mdoc);
  eq('link format', link.endsWith('/view.html?id=abc'), true);
  eq('invoice message', messageFor('invoice', mdoc, cust, {}), 'Hi Denise, here is your invoice TR-1012 from Terri Renee Evolvé for $341.00. Payment details are on the page: ' + link);
  eq('quote message', messageFor('quote', { ...mdoc, number: 'Q-1004' }, cust, {}), 'Hi Denise, here is your quote Q-1004 from Terri Renee Evolvé. Review and approve here: ' + link);
  eq('receipt message', messageFor('receipt', mdoc, cust, {}), 'Thank you, Denise! Your payment for TR-1012 is received: ' + link);
  eq('ready message (pickup)', messageFor('ready', mdoc, cust, {}), 'Hi Denise, your order TR-1012 is ready! It\'s ready for pickup.');
  eq('ready message (delivery)', messageFor('ready', { ...mdoc, fulfillment: 'delivery' }, cust, {}), 'Hi Denise, your order TR-1012 is ready! We\'ll be in touch to arrange delivery.');
  eq('template from Settings wins', messageFor('invoice', mdoc, cust, { msg_invoice: '{name}: {amount_due} due for {number}' }), 'Denise Carter: $341.00 due for TR-1012');
  eq('unknown placeholder kept', messageFor('invoice', mdoc, cust, { msg_invoice: 'Hi {nickname}' }), 'Hi {nickname}');

  const failed = results.filter((r) => !r.ok);
  document.getElementById('results').replaceChildren(...results.map((r) => {
    const li = document.createElement('li');
    li.className = r.ok ? 'pass' : 'fail';
    li.textContent = (r.ok ? '✓ ' : '✗ ') + r.name + (r.ok ? '' : `: got ${JSON.stringify(r.got)}, want ${JSON.stringify(r.want)}`);
    return li;
  }));
  const s = document.getElementById('summary');
  s.textContent = `${results.length - failed.length} passed, ${failed.length} failed`;
  s.className = failed.length ? 'fail' : 'pass';
  window.testResults = { passed: results.length - failed.length, failed: failed.length };
</script>
</body>
</html>
